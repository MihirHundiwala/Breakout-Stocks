services:
  - type: web
    name: breakout-stocks-api
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.scripts.run_api
    preDeployCommand: alembic upgrade head
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "10"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH_B64
        sync: false
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: NORMAL_USER_WATCHLIST_LIMIT
        value: "20"
      - key: APPLICATION_MODE
        value: watchlist
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: ENABLE_API_DOCS
        value: "false"
      - key: MAXIMUM_REQUEST_BODY_BYTES
        value: "65536"
      - key: METRICS_ENABLED
        value: "true"
      - key: METRICS_BEARER_TOKEN
        sync: false

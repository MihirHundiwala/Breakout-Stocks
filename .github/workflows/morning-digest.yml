name: Send morning watchlist setups

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

concurrency:
  group: morning-watchlist-digest
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: require
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      TELEGRAM_NOTIFICATIONS_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_TIMEOUT_SECONDS: "15"
      APPLICATION_MODE: watchlist
      ENABLE_API_DOCS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build the backend image
        run: docker build --target production --tag breakout-stocks-backend ./backend

      - name: Send current watchlist setups without retry storage
        run: >-
          docker run --rm
          --env POSTGRES_HOST
          --env POSTGRES_PORT
          --env POSTGRES_DB
          --env POSTGRES_USER
          --env POSTGRES_PASSWORD
          --env POSTGRES_SSLMODE
          --env UPSTOX_ACCESS_TOKEN
          --env TELEGRAM_NOTIFICATIONS_ENABLED
          --env TELEGRAM_BOT_TOKEN
          --env TELEGRAM_BOT_USERNAME
          --env TELEGRAM_TIMEOUT_SECONDS
          --env APPLICATION_MODE
          --env ENABLE_API_DOCS
          breakout-stocks-backend
          python -m app.scripts.send_morning_digest
